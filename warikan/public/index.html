<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>わりかん</title>
  <meta name="description" content="2人の生活費を記録して、2:1で割り勘するアプリ">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="わりかん">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 起動中 -->
  <section id="boot" class="screen boot">
    <img src="icons/icon.svg" alt="" class="setup-icon">
  </section>

  <!-- ログイン -->
  <section id="login" class="screen" hidden>
    <form id="login-form" class="setup-card" autocomplete="on">
      <img src="icons/icon.svg" alt="" class="setup-icon">
      <h1>わりかん</h1>
      <p class="muted" id="login-lead">だれがログインしますか？</p>
      <div id="login-members" class="member-choice" role="radiogroup" aria-label="名前"></div>
      <input type="text" id="login-name" name="username" autocomplete="username" hidden>
      <div id="login-fields" hidden>
        <p class="muted small-text" id="login-hint"></p>
        <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="パスワード" required minlength="8">
        <input id="login-password2" type="password" autocomplete="new-password" placeholder="パスワード（確認）" minlength="8" hidden>
        <input id="login-code" type="text" autocomplete="off" placeholder="招待コード" hidden>
        <button type="submit" id="login-submit" class="primary big">ログイン</button>
      </div>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- メイン -->
  <main id="app" class="screen" hidden>
    <header class="topbar">
      <div class="month-nav">
        <button id="prev-month" class="icon-btn" aria-label="前の月">‹</button>
        <select id="month-select" aria-label="表示する月"></select>
        <button id="next-month" class="icon-btn" aria-label="次の月">›</button>
      </div>
      <div class="topbar-actions">
        <button id="refresh" class="icon-btn" aria-label="更新">↻</button>
        <button id="open-settings" class="icon-btn" aria-label="設定">⋯</button>
      </div>
    </header>

    <section class="summary card" aria-live="polite">
      <p class="summary-label" id="settle-label">精算</p>
      <p class="summary-amount" id="settle-amount">—</p>
      <p class="summary-total" id="summary-total"></p>
      <div class="people" id="people"></div>
      <div class="settle-row">
        <p id="settle-status" class="settle-status"></p>
        <button type="button" id="settle-btn" class="ghost">精算済みにする</button>
      </div>
    </section>

    <form id="entry-form" class="card entry" autocomplete="off">
      <div class="edit-banner" id="edit-banner" hidden>
        <span>記録を編集中</span>
        <button type="button" id="cancel-edit" class="link-btn">キャンセル</button>
      </div>
      <label class="amount-field">
        <span class="yen">¥</span>
        <input id="amount" type="text" inputmode="numeric" placeholder="0" aria-label="金額" enterkeyhint="done">
      </label>

      <div class="field">
        <span class="field-label">払った人</span>
        <div id="payer" class="segmented" role="radiogroup" aria-label="払った人"></div>
      </div>

      <div class="field">
        <span class="field-label">だれの分？</span>
        <div id="burden" class="chips" role="radiogroup" aria-label="だれの分"></div>
      </div>

      <div class="field">
        <span class="field-label">何の費用？</span>
        <div id="categories" class="chips" role="radiogroup" aria-label="何の費用"></div>
      </div>

      <div class="field">
        <label class="field-label" for="comment">メモ</label>
        <input id="comment" type="text" placeholder="スーパー、ガソリン など" maxlength="200" enterkeyhint="done">
        <div id="suggestions" class="chips small"></div>
      </div>

      <div class="field row">
        <label class="field-label" for="date">日付</label>
        <input id="date" type="date">
      </div>

      <button type="submit" id="submit" class="primary big">記録する</button>
    </form>

    <section class="card list-card">
      <div class="list-head">
        <h2 id="list-title">記録</h2>
        <span id="list-count" class="muted"></span>
      </div>
      <ul id="entries" class="entries"></ul>
      <p id="empty" class="muted empty" hidden>まだ記録がありません</p>
    </section>

    <p class="footnote muted" id="status-line"></p>
  </main>

  <!-- 設定 -->
  <dialog id="settings">
    <h2>設定</h2>
    <p><strong id="settings-me"></strong> でログイン中</p>

    <form id="password-form" class="stack">
      <h3>パスワードの変更</h3>
      <input type="text" name="username" id="pw-username" autocomplete="username" hidden>
      <input id="pw-current" type="password" autocomplete="current-password" placeholder="今のパスワード" required>
      <input id="pw-next" type="password" autocomplete="new-password" placeholder="新しいパスワード（8文字以上）" required minlength="8">
      <button type="submit" class="ghost">変更する</button>
      <p id="pw-message" class="small-text muted" role="status"></p>
    </form>
    <hr>
    <a class="ghost block" href="/api/export.csv" download>記録をCSVでダウンロード（Excel用）</a>
    <a class="ghost block" href="/api/backup.json" download>バックアップを保存</a>
    <label class="ghost block file-btn">
      バックアップ・整理済みファイルを取り込む
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </label>
    <p id="import-message" class="small-text muted" role="status"></p>
    <button type="button" id="logout" class="danger">ログアウト</button>
    <button type="button" id="close-settings" class="primary">閉じる</button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
